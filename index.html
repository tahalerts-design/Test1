<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Profit Manager"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Profit Manager</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f5f7}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#f5f5f7}main{max-width:760px;margin:auto;padding:18px 14px 40px}h1{font-size:28px;margin:8px 0 3px}.sub{color:#6b7280;margin:0 0 18px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:12px 0}.kpi small,.muted{color:#6b7280}.kpi strong{display:block;font-size:22px;margin-top:5px}.profit{color:#047857}.loss{color:#b91c1c}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input,select,textarea,button{font:inherit;font-size:16px}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}button{min-height:46px;border:0;border-radius:13px;padding:10px 15px;font-weight:650}.primary{background:#111827;color:#fff}.secondary{background:#eef0f3;color:#111827}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.grow{flex:1}.event{border-top:1px solid #eee;padding:13px 0}.event:first-child{border-top:0}.event-head{display:flex;justify-content:space-between;gap:10px}.event h3{margin:0 0 4px;font-size:17px}.money{text-align:right;white-space:nowrap}.expense{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eee}.expense button{min-height:36px;padding:5px 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;color:#6b7280;padding:20px 5px}.badge{font-size:12px;background:#f3f4f6;border-radius:999px;padding:4px 8px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}#toast{position:sticky;bottom:12px;background:#111827;color:white;border-radius:12px;padding:10px 13px;display:none;margin-top:10px}@media(min-width:650px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><h1>Profit Manager</h1><p class="sub">Event revenue, expenses and profit — saved on this device.</p>
<div class="kpis"><div class="card kpi"><small>Total Revenue</small><strong id="rev">$0.00</strong></div><div class="card kpi"><small>Total Expenses</small><strong id="cost">$0.00</strong></div><div class="card kpi"><small>Net Profit</small><strong id="profit">$0.00</strong></div><div class="card kpi"><small>Profit Margin</small><strong id="margin">0.0%</strong></div></div>
<section class="card"><div class="section-title"><div><strong>New Event</strong><div class="muted">Create one job for each setup.</div></div></div><form id="eventForm"><label>Event / Client Name</label><input id="name" required maxlength="80" placeholder="e.g. Sofia's Birthday"><div class="grid2"><div><label>Event Date</label><input id="date" type="date"></div><div><label>Amount Charged ($)</label><input id="revenue" required type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div></div><label>Notes (optional)</label><textarea id="notes" rows="2" placeholder="Venue, setup details, balance due, etc."></textarea><div class="actions"><button class="primary" type="submit">Add Event</button></div></form></section>
<section class="card"><div class="section-title"><div><strong>Your Events</strong><div class="muted">Tap Manage to add expenses.</div></div><button id="export" class="secondary" type="button">Export Backup</button></div><div id="events"></div></section>
<section id="detail" class="card hidden"><div class="section-title"><div><strong id="detailName"></strong><div id="detailMeta" class="muted"></div></div><button id="close" class="secondary" type="button">Close</button></div><div class="grid2"><div><label>Amount Charged ($)</label><input id="editRevenue" type="number" min="0" step="0.01"></div><div><label>Event Date</label><input id="editDate" type="date"></div></div><label>Notes</label><textarea id="editNotes" rows="2"></textarea><div class="actions"><button id="saveEvent" class="secondary" type="button">Save Event Changes</button><button id="deleteEvent" class="danger" type="button">Delete Event</button></div><hr style="border:0;border-top:1px solid #eee;margin:18px 0"><strong>Add Expense</strong><div class="grid2"><div><label>Category</label><select id="cat"><option>U-Haul / Truck Rental</option><option>Gas / Fuel</option><option>Acrylic Cutouts</option><option>Foam Cutouts / Printing</option><option>Balloons</option><option>Wood / Build Materials</option><option>Paint / Supplies</option><option>Vinyl / Signage</option><option>Props / Rentals</option><option>Labour</option><option>Delivery / Transportation</option><option>Miscellaneous Purchase</option><option>Other</option></select></div><div><label>Cost ($)</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div></div><label>Description</label><input id="desc" maxlength="100" placeholder="e.g. U-Haul rental"><div class="actions"><button id="addExpense" class="primary" type="button">Add Expense</button></div><div id="expenses" style="margin-top:12px"></div><div class="grid2" style="margin-top:14px"><div class="kpi"><small>Total Cost</small><strong id="detailCost">$0.00</strong></div><div class="kpi"><small>Final Profit</small><strong id="detailProfit">$0.00</strong></div></div></section><div id="toast"></div>
<script>
(()=>{const KEY='profit-manager-v1';let state={events:[]},selected=null;const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n||0);try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.events))state=s}catch(e){}const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const total=e=>e.expenses.reduce((s,x)=>s+x.amount,0);const net=e=>e.revenue-total(e);function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}function render(){let r=0,c=0;state.events.forEach(e=>{r+=e.revenue;c+=total(e)});$('rev').textContent=money(r);$('cost').textContent=money(c);$('profit').textContent=money(r-c);$('profit').className=r-c<0?'loss':'profit';$('margin').textContent=r?(((r-c)/r)*100).toFixed(1)+'%':'0.0%';$('events').innerHTML=state.events.length?state.events.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>`<div class="event"><div class="event-head"><div><h3>${esc(e.name)}</h3><div class="muted">${e.date||'No date'} · ${e.expenses.length} expense${e.expenses.length===1?'':'s'}</div></div><div class="money"><div>${money(e.revenue)}</div><strong class="${net(e)<0?'loss':'profit'}">${money(net(e))} profit</strong></div></div><div class="actions"><button class="secondary manage" data-id="${e.id}" type="button">Manage</button></div></div>`).join(''):'<div class="empty">No events yet. Add your first setup above.</div>';document.querySelectorAll('.manage').forEach(b=>b.onclick=()=>openEvent(b.dataset.id));if(selected)renderDetail()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function current(){return state.events.find(e=>e.id===selected)}function openEvent(id){selected=id;$('detail').classList.remove('hidden');renderDetail();$('detail').scrollIntoView({behavior:'smooth',block:'start'})}function renderDetail(){const e=current();if(!e){$('detail').classList.add('hidden');return}$('detailName').textContent=e.name;$('detailMeta').textContent=`${e.date||'No date'} · ${money(e.revenue)} charged`;$('editRevenue').value=e.revenue;$('editDate').value=e.date||'';$('editNotes').value=e.notes||'';$('detailCost').textContent=money(total(e));$('detailProfit').textContent=money(net(e));$('detailProfit').className=net(e)<0?'loss':'profit';$('expenses').innerHTML=e.expenses.length?e.expenses.map(x=>`<div class="expense"><div><strong>${esc(x.category)}</strong><div class="muted">${esc(x.desc||'No description')}</div></div><div class="money"><strong>${money(x.amount)}</strong><br><button class="danger remove" data-x="${x.id}" type="button">Remove</button></div></div>`).join(''):'<div class="empty">No expenses entered yet.</div>';document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{e.expenses=e.expenses.filter(x=>x.id!==b.dataset.x);save()})}$('eventForm').onsubmit=ev=>{ev.preventDefault();const n=$('name').value.trim(),r=Number($('revenue').value);if(!n||!Number.isFinite(r)||r<0)return;state.events.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:n,date:$('date').value,revenue:r,notes:$('notes').value.trim(),expenses:[]});ev.target.reset();save();toast('Event added')};$('addExpense').onclick=()=>{const e=current(),a=Number($('amount').value);if(!e||!Number.isFinite(a)||a<0){toast('Enter a valid cost');return}e.expenses.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),category:$('cat').value,desc:$('desc').value.trim(),amount:a});$('amount').value='';$('desc').value='';save();toast('Expense added')};$('saveEvent').onclick=()=>{const e=current(),r=Number($('editRevenue').value);if(!e||!Number.isFinite(r)||r<0)return;e.revenue=r;e.date=$('editDate').value;e.notes=$('editNotes').value.trim();save();toast('Event updated')};$('deleteEvent').onclick=()=>{const e=current();if(e&&confirm(`Delete ${e.name}?`)){state.events=state.events.filter(x=>x.id!==e.id);selected=null;save();toast('Event deleted')}};$('close').onclick=()=>{selected=null;$('detail').classList.add('hidden')};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='profit-manager-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render()})();
</script></main></body></html>
